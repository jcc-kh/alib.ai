<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pier 9, the evening of 16 April</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow+Semi+Condensed:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --water: #0b1d2b; --water-line: #1c3a4f; --land: #1a2a2b; --land-edge: #35504d;
    --ink: #e3ebe7; --ink-soft: #94a8a6; --ink-faint: #5d7474; --road: #2c4141;
    --signal: #f4c95d; --panel: #0f1a1d;
    --face: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
    --numerals: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #070d10; color: var(--ink); font-family: var(--face); }
  #stage { width: 100vw; height: 100vh; display: block; }
  text { font-family: var(--face); fill: var(--ink); }
  .numerals { font-family: var(--numerals); font-variant-numeric: tabular-nums; }
  .place { font-size: 17px; fill: var(--ink-soft); }
  .water-name { font-style: italic; font-size: 30px; fill: #3f6a85; letter-spacing: 0.12em; }
  .graticule { font-size: 14px; fill: var(--ink-faint); }
  .lane-name { font-size: 24px; font-weight: 500; }
  .lane-note { font-size: 17px; fill: var(--ink-soft); }
  .hour { font-size: 17px; fill: var(--ink-faint); }
  .log-time { font-size: 24px; fill: var(--ink-soft); }
  .log-text { font-size: 24px; }
  .log-note { font-size: 19px; fill: var(--signal); }
  .dot-letter { font-size: 15px; font-weight: 600; fill: #0b1d2b; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .dark-label { font-size: 18px; }
  #controls { position: fixed; right: 18px; top: 14px; display: flex; gap: 8px; align-items: center; opacity: .85; }
  #controls.hidden { display: none; }
  button { font: 500 15px var(--face); color: var(--ink); background: #16282c; border: 1px solid #35504d; border-radius: 4px; padding: 7px 14px; cursor: pointer; }
  button:hover { background: #1f373c; }
  button:focus-visible, #lanes-hit:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
  #lanes-hit { cursor: ew-resize; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Replay of five phones' locations on the evening of 16 April">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#8fa3a1" stroke-width="2"/></pattern>
    <clipPath id="chart-clip"><rect x="60" y="45" width="700" height="990"/></clipPath>
    <clipPath id="reveal"><rect id="reveal-rect" x="1010" y="330" width="0" height="330"/></clipPath>
  </defs>
  <rect width="1920" height="1080" fill="#070d10"/>
  <g id="chart" clip-path="url(#chart-clip)"></g>
  <g id="chart-frame"></g>
  <g id="panel"></g>
</svg>
<div id="controls"><button id="play">Play</button><button id="restart">Start again</button><button id="speed">Speed 1×</button></div>
<script src="replay-data.js"></script>
<script>
const D = window.REPLAY, NS = "http://www.w3.org/2000/svg";
const el = (name, attrs = {}, parent, text) => { const e = document.createElementNS(NS, name); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; if (parent) parent.appendChild(e); return e; };
const clock = (m) => { const t = Math.floor(m + 1e-6), h = 18 + Math.floor(t / 60); return `${String(h % 24).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`; };
const possessive = (name) => name + "'s";

// ---- chart projection: plain latitude and longitude, north up
const BOX = { lat0: 40.912, lat1: 41.075, lon0: -72.065, lon1: -71.925 }, C = { x: 60, y: 45, w: 700, h: 990 };
const px = (lat, lon) => [C.x + (lon - BOX.lon0) / (BOX.lon1 - BOX.lon0) * C.w, C.y + (BOX.lat1 - lat) / (BOX.lat1 - BOX.lat0) * C.h];
const KM = C.h / ((BOX.lat1 - BOX.lat0) * 111);
const place = (n) => D.places.find((p) => p.name === n), at = (n) => px(place(n).lat, place(n).lon);
const chart = document.getElementById("chart"), frame = document.getElementById("chart-frame"), panel = document.getElementById("panel");

// land, shoreline and the bay. The city is invented, so the coast is drawn, not mapped.
el("rect", { x: C.x, y: C.y, width: C.w, height: C.h, fill: "var(--land)" }, chart);
const shore = [[40.9285, -72.065], [40.9300, -72.020], [40.9335, -71.985], [40.9362, -71.9655], [40.9368, -71.9585], [40.9440, -71.948], [40.9530, -71.938], [40.9575, -71.925]].map(([a, o]) => px(a, o));
const shorePath = (dy) => "M" + shore.map(([x, y]) => `${x.toFixed(1)},${(y + dy).toFixed(1)}`).join(" L");
el("path", { d: shorePath(0) + ` L${C.x + C.w},${C.y + C.h} L${C.x},${C.y + C.h} Z`, fill: "var(--water)" }, chart);
[14, 34, 60].forEach((dy, i) => el("path", { d: shorePath(dy), fill: "none", stroke: "var(--water-line)", "stroke-width": 1, opacity: 0.9 - i * 0.25 }, chart));
el("path", { d: shorePath(0), fill: "none", stroke: "var(--land-edge)", "stroke-width": 2 }, chart);
el("text", { x: C.x + 60, y: C.y + C.h - 26, class: "water-name" }, chart, "Calder Bay");
// roads between the places people actually travel between
[["Harbor Supply Co.", "Dock Cafe", "Mehta residence", "Harbor Rd lot", "Pier 9 Warehouse"], ["Becker residence", "Mehta residence", "Novak residence"],
 ["Riverside Gym", "FreshMart", "Harbor Supply Co.", "Walsh residence"], ["Brooks residence", "Harbor Supply Co."], ["Becker residence", "Harbor Rd lot"]]
  .forEach((r) => el("polyline", { points: r.map((n) => at(n).map((v) => v.toFixed(1)).join(",")).join(" "), fill: "none", stroke: "var(--road)", "stroke-width": 2, "stroke-linejoin": "round" }, chart));
// the pier itself, and a one-kilometre ring around the scene
const [sx, sy] = at("Pier 9 Warehouse");
el("line", { x1: sx + 4, y1: sy + 6, x2: sx + 22, y2: sy + 44, stroke: "var(--land-edge)", "stroke-width": 7 }, chart);
el("circle", { cx: sx, cy: sy, r: KM, fill: "rgba(244,201,93,.05)", stroke: "var(--signal)", "stroke-width": 1.5, "stroke-dasharray": "3 7", opacity: .8 }, chart);
el("text", { x: sx - KM - 6, y: sy - 8, class: "place", "text-anchor": "end", fill: "var(--signal)" }, chart, "1 km from the scene").setAttribute("style", "fill:var(--signal)");
const LABEL = { "Pier 9 Warehouse": [16, 30, "Pier 9 warehouse"], "Harbor Rd lot": [-14, -10, "Harbor Rd lot", "end"], "Harbor Supply Co.": [14, -10, "Harbor Supply Co."], "Dock Cafe": [14, 6, "Dock Cafe"],
  "Mehta residence": [14, -8, "Ravi's home"], "Becker residence": [-14, 6, "Paul's home", "end"], "Brooks residence": [-16, -12, "Amy's home", "end"], "Walsh residence": [16, 24, "Ken's home"],
  "Novak residence": [-14, -12, "Cara's home", "end"], "Riverside Gym": [14, -10, "Riverside Gym"], "FreshMart": [14, 6, "FreshMart"] };
for (const n in LABEL) {
  const [x, y] = at(n), [dx, dy, label, anchor] = LABEL[n], scene = n === "Pier 9 Warehouse";
  if (scene) { el("rect", { x: x - 7, y: y - 7, width: 14, height: 14, fill: "none", stroke: "var(--signal)", "stroke-width": 2.5, transform: `rotate(45 ${x} ${y})` }, chart); }
  else el("circle", { cx: x, cy: y, r: 3.5, fill: "var(--ink-faint)" }, chart);
  const t = el("text", { x: x + dx, y: y + dy, class: "place", "text-anchor": anchor || "start" }, chart, label);
  if (scene) t.setAttribute("style", "fill:var(--signal);font-size:21px;font-weight:500");
}
// chart frame with real coordinates on the margins, and a scale bar
el("rect", { x: C.x, y: C.y, width: C.w, height: C.h, fill: "none", stroke: "var(--land-edge)", "stroke-width": 1.5 }, frame);
for (let lat = 40.94; lat < 41.07; lat += 0.02) { const [, y] = px(lat, BOX.lon0); el("line", { x1: C.x - 8, y1: y, x2: C.x, y2: y, stroke: "var(--ink-faint)" }, frame); el("text", { x: C.x - 12, y: y + 5, class: "graticule numerals", "text-anchor": "end", transform: `rotate(-90 ${C.x - 12} ${y})` }, frame, lat.toFixed(2) + "°N").setAttribute("text-anchor", "middle"); }
for (let lon = -72.04; lon < -71.93; lon += 0.04) { const [x] = px(BOX.lat0, lon); el("line", { x1: x, y1: C.y + C.h, x2: x, y2: C.y + C.h + 8, stroke: "var(--ink-faint)" }, frame); el("text", { x, y: C.y + C.h + 26, class: "graticule numerals", "text-anchor": "middle" }, frame, Math.abs(lon).toFixed(2) + "°W"); }
el("line", { x1: C.x + 24, y1: C.y + 34, x2: C.x + 24 + 2 * KM, y2: C.y + 34, stroke: "var(--ink-soft)", "stroke-width": 2 }, frame);
el("text", { x: C.x + 24 + 2 * KM + 10, y: C.y + 40, class: "graticule numerals" }, frame, "2 km");

// ---- phones on the chart
const links = el("g", {}, chart), trails = el("g", {}, chart), dots = el("g", {}, chart);
const GAP = 12;   // minutes between fixes before the phone counts as dark
D.phones.forEach((p) => {
  p.pts = p.fixes.map(([t, lat, lon]) => [t, ...px(lat, lon)]);
  p.trail = el("polyline", { fill: "none", stroke: p.colour, "stroke-width": 3, "stroke-linecap": "round", "stroke-linejoin": "round", opacity: .55 }, trails);
  p.g = el("g", {}, dots);
  p.ring = el("circle", { r: 15, fill: "none", stroke: p.colour, "stroke-width": 2, "stroke-dasharray": "4 5", opacity: 0 }, p.g);
  p.dot = el("circle", { r: 11, fill: p.colour, stroke: "#0b1d2b", "stroke-width": 2.5 }, p.g);
  p.letter = el("text", { class: "dot-letter" }, p.g, p.name[0]);
  p.label = el("text", { class: "dark-label", x: 24, y: 6, opacity: 0, "paint-order": "stroke", stroke: "#12201f", "stroke-width": 5 }, p.g);
  p.label.setAttribute("style", `fill:${p.colour}`);
  // stretches with and without location data, for the lanes
  p.dark = [];
  for (let i = 0; i < p.pts.length - 1; i++) if (p.pts[i + 1][0] - p.pts[i][0] > GAP) {
    const off = p.power.find(([t, type]) => type === "power_off" && t >= p.pts[i][0] && t < p.pts[i + 1][0]);
    p.dark.push({ from: off ? off[0] : p.pts[i][0] + 5, to: p.pts[i + 1][0], last: p.pts[i][0], why: off ? "phone off" : "no location data" });
  }
});
function state(p, t) {
  const gap = p.dark.find((g) => t >= g.from && t < g.to);
  let i = 0; while (i < p.pts.length - 1 && p.pts[i + 1][0] <= t) i++;
  const a = p.pts[i], b = p.pts[Math.min(i + 1, p.pts.length - 1)];
  if (gap) { const last = p.pts.filter((q) => q[0] <= gap.last).pop(); return { x: last[1], y: last[2], gap }; }
  const f = b[0] > a[0] && b[0] - a[0] <= GAP ? Math.min(1, Math.max(0, (t - a[0]) / (b[0] - a[0]))) : 0;
  return { x: a[1] + (b[1] - a[1]) * f, y: a[2] + (b[2] - a[2]) * f, gap: null };
}

// ---- right-hand panel: clock, lanes, log
const P = { x: 840, laneX: 1010, laneW: 850, laneY: 350, laneH: 58 };
const tx = (m) => P.laneX + m / D.minutes * P.laneW;
const clockText = el("text", { x: P.x, y: 205, class: "numerals", "font-size": 190, "font-weight": 600 }, panel, "18:00");
el("text", { x: P.x + 4, y: 262, "font-size": 30, fill: "var(--ink-soft)" }, panel, "Thursday 16 April 2026, Port Calder").setAttribute("style", "fill:var(--ink-soft)");
const headline = el("text", { x: P.x + 490, y: 150, "font-size": 30, "font-weight": 500 }, panel, "");
const headline2 = el("text", { x: P.x + 490, y: 190, "font-size": 30, "font-weight": 500 }, panel, "");
// time-of-death window, from the medical examiner
el("rect", { x: tx(D.window[0]), y: P.laneY - 34, width: tx(D.window[1]) - tx(D.window[0]), height: 5 * P.laneH + 34, fill: "rgba(244,201,93,.09)" }, panel);
el("text", { x: tx(D.window[0]) + 8, y: P.laneY - 12, "font-size": 18 }, panel, "Time of death, 21:00 to 23:30").setAttribute("style", "fill:var(--signal)");
const revealed = el("g", { "clip-path": "url(#reveal)" }, panel);
D.phones.forEach((p, i) => {
  const y = P.laneY + i * P.laneH + P.laneH / 2;
  el("circle", { cx: P.x + 12, cy: y, r: 9, fill: p.colour }, panel);
  el("text", { x: P.x + 32, y: y + 8, class: "lane-name" }, panel, p.name);
  el("line", { x1: P.laneX, y1: y, x2: P.laneX + P.laneW, y2: y, stroke: "#1e3034", "stroke-width": 2 }, panel);
  const first = p.pts[0][0], last = p.pts[p.pts.length - 1][0];
  let cursor = first;
  p.dark.concat([{ from: last, to: last }]).forEach((g) => {
    el("line", { x1: tx(cursor), y1: y, x2: tx(g.from), y2: y, stroke: p.colour, "stroke-width": 9, "stroke-linecap": "round" }, revealed);
    if (g.to > g.from) {
      el("rect", { x: tx(g.from), y: y - 13, width: tx(g.to) - tx(g.from), height: 26, fill: "url(#hatch)", opacity: .75 }, revealed);
      el("text", { x: tx(g.from) + 6, y: y - 19, class: "lane-note" }, revealed, g.why);
    }
    cursor = g.to;
  });
});
for (let h = 0; h <= 6; h++) { const x = tx(h * 60); el("line", { x1: x, y1: P.laneY + 5 * P.laneH, x2: x, y2: P.laneY + 5 * P.laneH + 8, stroke: "var(--ink-faint)" }, panel); el("text", { x, y: P.laneY + 5 * P.laneH + 30, class: "hour numerals", "text-anchor": "middle" }, panel, `${String((18 + h) % 24).padStart(2, "0")}:00`); }
const playhead = el("line", { y1: P.laneY - 34, y2: P.laneY + 5 * P.laneH + 6, stroke: "var(--ink)", "stroke-width": 2 }, panel);
const hit = el("rect", { id: "lanes-hit", x: P.laneX, y: P.laneY - 34, width: P.laneW, height: 5 * P.laneH + 40, fill: "transparent", tabindex: 0, role: "slider", "aria-label": "Time", "aria-valuemin": 0, "aria-valuemax": D.minutes }, panel);
const logG = el("g", {}, panel);
el("text", { x: P.x, y: 1046, "font-size": 19 }, panel, "Each dot is a phone, not a person. Synthetic case; every position, message and call comes from the phone data.").setAttribute("style", "fill:var(--ink-faint)");

// ---- the log: messages and calls between the five, power events, and location data stopping or returning
const name = Object.fromEntries(D.phones.map((p) => [p.id, p.name]));
const LOG = [];
D.events.forEach((e) => {
  const text = e.kind === "text" ? `${name[e.frm]} texts ${name[e.to]}: “${e.body}”` : `${name[e.frm]} calls ${name[e.to]}, ${e.duration_s ? e.duration_s + " seconds" : "no answer"}`;
  let note = e.only_on ? `Now only on ${possessive(name[e.only_on])} phone` : "";
  if (e.delivered) note = `Reached ${possessive(name[e.to])} phone at ${clock(e.delivered)}`;
  LOG.push({ t: e.t, text, note, link: [e.frm, e.to] });
});
D.phones.forEach((p) => p.dark.forEach((g) => {
  LOG.push({ t: g.from, text: g.why === "phone off" ? `${possessive(p.name)} phone is switched off` : `${possessive(p.name)} phone stops reporting its location`, note: "", who: p.id });
  LOG.push({ t: g.to, text: g.why === "phone off" ? `${possessive(p.name)} phone is back on` : `${possessive(p.name)} phone reports its location again`, note: "", who: p.id });
}));
LOG.sort((a, b) => a.t - b.t);
function wrap(text, max) { const words = text.split(" "), lines = [""]; words.forEach((w) => { if ((lines[lines.length - 1] + " " + w).trim().length > max) lines.push(w); else lines[lines.length - 1] = (lines[lines.length - 1] + " " + w).trim(); }); return lines; }

let shownLog = -1;
function render(t) {
  clockText.textContent = clock(t);
  playhead.setAttribute("x1", tx(t)); playhead.setAttribute("x2", tx(t));
  document.getElementById("reveal-rect").setAttribute("width", Math.max(0, tx(t) - P.laneX));
  hit.setAttribute("aria-valuenow", Math.round(t)); hit.setAttribute("aria-valuetext", clock(t));
  const darkNow = [];
  D.phones.forEach((p) => {
    const s = state(p, t);
    p.g.setAttribute("transform", `translate(${s.x.toFixed(1)} ${s.y.toFixed(1)})`);
    p.dot.setAttribute("fill", s.gap ? "none" : p.colour); p.dot.setAttribute("stroke", s.gap ? p.colour : "#0b1d2b");
    p.dot.setAttribute("stroke-dasharray", s.gap ? "3 4" : "none"); p.letter.setAttribute("style", s.gap ? `fill:${p.colour}` : "");
    p.ring.setAttribute("opacity", s.gap ? .5 + .3 * Math.sin(performance.now() / 300) : 0);
    p.label.setAttribute("opacity", s.gap ? 1 : 0);
    if (s.gap) { p.label.textContent = `${s.gap.why}, last fix ${clock(s.gap.last)}`; darkNow.push(p.name); }
    const pts = p.pts.filter((q) => q[0] <= t && q[0] >= t - 50 && !p.dark.some((g) => q[0] > g.last && q[0] < g.to)).map((q) => `${q[1].toFixed(1)},${q[2].toFixed(1)}`);
    if (!s.gap) pts.push(`${s.x.toFixed(1)},${s.y.toFixed(1)}`);
    p.trail.setAttribute("points", pts.join(" "));
  });
  headline.textContent = darkNow.length ? `${darkNow.join(" and ")}: no location data` : "All five phones are reporting";
  headline.setAttribute("style", darkNow.length ? "fill:var(--signal)" : "fill:var(--ink-soft)");
  headline2.textContent = t >= D.window[0] && t < D.window[1] ? "Inside the time-of-death window" : "";
  headline2.setAttribute("style", "fill:var(--ink-soft)");
  // contact lines: drawn for six minutes of case time after a message or call
  links.replaceChildren();
  LOG.filter((e) => e.link && t >= e.t && t < e.t + 6).forEach((e) => {
    const a = state(D.phones.find((p) => p.id === e.link[0]), t), b = state(D.phones.find((p) => p.id === e.link[1]), t);
    el("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: "var(--ink)", "stroke-width": 2, "stroke-dasharray": "2 6", opacity: 1 - (t - e.t) / 6 }, links);
  });
  const upto = LOG.filter((e) => e.t <= t).length - 1;
  if (upto !== shownLog) {
    shownLog = upto; logG.replaceChildren();
    let y = 722;
    for (let i = upto, n = 0; i >= 0 && n < 5 && y < 990; i--, n++) {
      const e = LOG[i], g = el("g", { opacity: [1, .66, .46, .32, .22][n] }, logG);
      el("text", { x: P.x, y, class: "log-time numerals" }, g, clock(e.t));
      wrap(e.text, 78).forEach((line, k) => el("text", { x: P.x + 78, y: y + k * 30, class: "log-text" }, g, line));
      y += wrap(e.text, 78).length * 30;
      if (e.note) { el("text", { x: P.x + 78, y: y - 2, class: "log-note" }, g, e.note); y += 26; }
      y += 16;
    }
  }
}

// ---- playback
const params = new URLSearchParams(location.search), reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let t = 0, playing = false, speed = 1, lastFrame = 0;
const SECONDS = Number(params.get("seconds")) || 40;      // length of one full run at 1×
const playBtn = document.getElementById("play");
function setPlaying(v) { playing = v; playBtn.textContent = v ? "Pause" : t >= D.minutes ? "Play again" : "Play"; lastFrame = performance.now(); }
function tick(now) {
  if (playing) { t = Math.min(D.minutes, t + (now - lastFrame) / 1000 * (D.minutes / SECONDS) * speed); if (t >= D.minutes) setPlaying(false); }
  lastFrame = now; render(t); requestAnimationFrame(tick);
}
playBtn.onclick = () => { if (t >= D.minutes) t = 0; setPlaying(!playing); };
document.getElementById("restart").onclick = () => { t = 0; shownLog = -1; setPlaying(true); };
document.getElementById("speed").onclick = (e) => { speed = speed === 1 ? 2 : speed === 2 ? 0.5 : 1; e.target.textContent = `Speed ${speed}×`; };
const seek = (ev) => { const r = hit.getBoundingClientRect(); t = Math.min(D.minutes, Math.max(0, (ev.clientX - r.left) / r.width * D.minutes)); shownLog = -1; };
hit.addEventListener("pointerdown", (ev) => { hit.setPointerCapture(ev.pointerId); seek(ev); hit.onpointermove = seek; });
hit.addEventListener("pointerup", () => { hit.onpointermove = null; });
addEventListener("keydown", (ev) => {
  if (ev.key === " " && ev.target.tagName !== "BUTTON") { ev.preventDefault(); playBtn.click(); }
  if (ev.key === "ArrowRight") { t = Math.min(D.minutes, t + 5); shownLog = -1; }
  if (ev.key === "ArrowLeft") { t = Math.max(0, t - 5); shownLog = -1; }
});
if (params.get("at")) { const [h, m] = params.get("at").split(":").map(Number); t = (h - 18) * 60 + m; }
if (params.has("clean")) document.getElementById("controls").classList.add("hidden");   // for recording
window.seekTo = (m) => { t = m; shownLog = -1; render(t); };
setPlaying(params.has("autoplay") && !reduce && !params.get("at"));
requestAnimationFrame(tick);
</script>
</body>
</html>
